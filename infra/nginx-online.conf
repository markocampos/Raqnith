# Raqnith / ActionGuard — Nginx server block (ONLINE MODE)
# Serves raqnith.duckdns.org via the existing portfolio-nginx container.
# Mounts into: /etc/nginx/conf.d/raqnith.conf:ro

# --- HTTP -> HTTPS redirect + ACME challenge ---
server {
    listen 80;
    server_name raqnith.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: main frontend ---
server {
    listen 443 ssl;
    http2 on;
    server_name raqnith.duckdns.org;
    client_max_body_size 50M;

    ssl_certificate /etc/letsencrypt/live/raqnith.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raqnith.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_RAQNITH:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/raqnith-access.log;
    error_log /var/log/nginx/raqnith-error.log;

    # Django static files (collected into staticfiles/; mounted read-only)
    location /static/ {
        alias /var/www/raqnith-static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Raqnith Django app (gunicorn on the host; host.docker.internal = 172.18.0.1)
    location / {
        proxy_pass http://host.docker.internal:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
