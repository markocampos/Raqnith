# Raqnith — Nginx server block (OFFLINE MODE)
# Blocks public access, instructs search engines not to index, and serves offline maintenance response.
# Mounts into: /etc/nginx/conf.d/raqnith.conf:ro

# --- HTTP -> HTTPS redirect + ACME challenge ---
server {
    listen 80;
    server_name raqnith.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: Offline Mode ---
server {
    listen 443 ssl;
    http2 on;
    server_name raqnith.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/raqnith.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/raqnith.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL_RAQNITH_OFFLINE:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Prevent search engines from crawling, indexing, or caching the site
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
    add_header Retry-After "86400" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/raqnith-access.log;
    error_log /var/log/nginx/raqnith-error.log;

    # Return 503 Service Unavailable for robots.txt with disallow
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Return 503 Service Unavailable with branded maintenance page
    location / {
        default_type text/html;
        # NOTE: any add_header at location level disables inheritance of
        # server-level add_header, so restate the full header set here.
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex" always;
        add_header Retry-After "86400" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        return 503 '<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta http-equiv="refresh" content="60">
<title>We will be right back - Raqnith</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#0b0f19;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;line-height:1.5;-webkit-font-smoothing:antialiased}
.card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:2.75rem 2rem;max-width:480px;width:100%;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,.5)}
.icon{width:56px;height:56px;margin:0 auto 1.25rem;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#f5a623}
.badge{display:inline-block;background:rgba(245,158,11,.15);color:#f5a623;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:.3rem .75rem;border-radius:9999px;margin-bottom:1rem;border:1px solid rgba(245,158,11,.3)}
h1{font-size:1.5rem;font-weight:700;color:#fff;margin-bottom:.75rem}
p{font-size:.935rem;color:#94a3b8;margin-bottom:1.75rem}
.status{display:flex;align-items:center;justify-content:center;gap:.6rem;width:fit-content;margin:0 auto 1rem;background:#0b0f19;border:1px solid #1f2937;border-radius:9999px;padding:.55rem 1rem;font-size:.85rem;color:#cbd5e1}
.dot{width:8px;height:8px;border-radius:50%;background:#f5a623;flex-shrink:0;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(251,191,36,.5)}70%{box-shadow:0 0 0 9px rgba(251,191,36,0)}100%{box-shadow:0 0 0 0 rgba(251,191,36,0)}}
.note{font-size:.8rem;color:#64748b;margin-bottom:1.75rem}
.trust{display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap;padding-top:1.5rem;border-top:1px solid #1f2937;font-size:.78rem;color:#64748b}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}
@media(max-width:380px){.card{padding:2rem 1.25rem}h1{font-size:1.3rem}}
</style></head><body>
<div class="card">
<div class="icon"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
<div class="badge">Scheduled Maintenance</div>
<h1>We will be right back</h1>
<p>Raqnith is briefly offline for scheduled maintenance. Your account, orders and downloads are safe and will be right where you left them.</p>
